# Docker Compose de produção — worker + Postgres + Redis para um VPS único.
#
# Escopo (decidido em 2026-08-25, ver DECISIONS.md "Migração Railway -> VPS
# próprio (EasyPanel)"): o app "web" (Next.js) continua na Vercel — este
# compose NÃO tem serviço "web". Ele existe para:
#   1. Testar localmente que a imagem do worker builda e roda de ponta a
#      ponta antes de configurar o mesmo Dockerfile no EasyPanel.
#   2. Servir de fallback documentado para quem preferir um VPS "cru" (sem
#      EasyPanel) via `docker compose` puro — nesse caso sobe Postgres e
#      Redis próprios em vez dos templates do EasyPanel.
#
# No EasyPanel, o caminho recomendado é diferente deste arquivo: Postgres e
# Redis via templates nativos do EasyPanel (backup agendado, upgrade de
# versão e métricas prontos), e o worker como um serviço "App" separado
# apontando para apps/worker/Dockerfile. Ver README.md ("Deploy no
# EasyPanel").
#
# Uso (fallback via docker compose puro): ver README.md ("Deploy no VPS
# sem EasyPanel").

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wordbee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: wordbee
    volumes:
      - wordbee_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordbee"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - wordbee_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wordbee:${POSTGRES_PASSWORD:?}@postgres:5432/wordbee
      REDIS_URL: redis://redis:6379
    volumes:
      - wordbee_uploads:/repo/storage/uploads

volumes:
  wordbee_postgres_data:
  wordbee_redis_data:
  wordbee_uploads:
