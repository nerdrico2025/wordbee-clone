# TYPE   DATABASE  USER  ADDRESS       METHOD
# Socket local, só de dentro do container (initdb e scripts de init do
# entrypoint oficial usam isso).
local    all       all                 trust
host     all       all   127.0.0.1/32  scram-sha-256
host     all       all   ::1/128       scram-sha-256
# Qualquer outra origem (Vercel, worker, sua máquina): só com TLS. Não há
# linha `host` para essas faixas, então conexão sem TLS é recusada.
hostssl  all       all   0.0.0.0/0     scram-sha-256
hostssl  all       all   ::/0          scram-sha-256
